name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.9.8'
      - name: Install locked development environment
        run: uv sync --locked --python ${{ matrix.python }}
      - name: Test CLI and installed distributions
        run: uv run --locked pytest -ra
      - name: Build release distributions
        run: uv build
      - name: Validate package metadata
        run: uv run --locked twine check dist/*
      - name: Render README
        run: uv run --locked python -m readme_renderer README.md --output "${{ runner.temp }}/humanmd-readme.html"
